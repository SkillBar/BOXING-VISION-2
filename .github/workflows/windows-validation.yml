name: Windows validation (not a release)

on:
  push:
    branches: [codex/boxing-vision-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  regressions:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install application and desktop dependencies (no private assets)
        run: python -m pip install -e '.[dev]' -r packaging/windows/requirements.txt pytest-timeout cryptography
      - name: Python regressions on Windows
        # Media tests need both tools, not just the codec bundled inside OpenCV.
        # Source is pinned to the same upstream build as the private installer.
        run: |
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.1-essentials_build.zip' -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/ffmpeg.zip" -Algorithm SHA256).Hash.ToLower() -ne 'fec81ae03971d9dd4be3ebe02e263bd2ec1d789483f931bdba5f5715e65da2e9') { throw 'FFmpeg checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ffmpeg"
          $ffmpegBin = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty DirectoryName
          $env:PATH = "$ffmpegBin;$env:PATH"
          python -m pytest -o addopts= -v --timeout=60 --junitxml=qa/windows/python-tests.xml
      - name: Workspace regressions
        if: always()
        run: node tools/test_workspace_state.mjs
      - name: Retain test report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-regression-report
          path: qa/windows/*.xml
          if-no-files-found: warn
          retention-days: 14

  installer:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native window automation
        run: python -m pip install pywinauto==0.6.9 pillow
      - name: Compile and exercise real installer wizard using an inert QA payload
        run: python tools/windows_installer_qa.py --output qa/windows-installer
      - name: Retain screenshots and evidence, never the test executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-evidence-NOT-release
          path: |
            qa/windows-installer/*.png
            qa/windows-installer/*.json
            qa/windows-installer/*.log
            qa/windows-installer/*.txt
          if-no-files-found: error
          retention-days: 14

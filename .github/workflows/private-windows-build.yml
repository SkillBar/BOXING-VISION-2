name: Private Windows evaluation build (encrypted)

on:
  push:
    branches: [codex/boxing-vision-windows]
    paths:
      - '.github/workflows/private-windows-build.yml'
      - 'tools/build_windows.py'
      - 'tools/private_windows_build.py'
      - 'packaging/windows/boxing_vision.spec'
      - 'boxing_vision/desktop.py'
  workflow_dispatch:

permissions:
  # GitHub restricts draft-release visibility to collaborators with write access.
  # Used only to DOWNLOAD the ciphertext draft; no release publishing step exists.
  contents: write

jobs:
  build:
    if: vars.BOXING_WINDOWS_INPUT_TAG != ''
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      INPUT_TAG: ${{ vars.BOXING_WINDOWS_INPUT_TAG }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build tooling before accessing private inputs
        run: python -m pip install -e '.[dev]' -r packaging/windows/requirements.txt cryptography==46.0.7 pywinauto==0.6.9
      - name: Download ciphertext from an unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:INPUT_TAG" --repo "$env:GITHUB_REPOSITORY" --pattern inputs.bvenc --dir private-transfer
      - name: Authenticate and decrypt private assets
        env:
          BOXING_WINDOWS_TRANSFER_KEY: ${{ secrets.BOXING_WINDOWS_TRANSFER_KEY }}
        run: |
          python tools/private_build_transfer.py decrypt private-transfer/inputs.bvenc private-transfer/inputs.zip
          python tools/private_build_transfer.py unpack private-transfer/inputs.zip private-transfer/input
      - name: Build full application and installer
        run: python tools/private_windows_build.py --input private-transfer/input --output private-transfer/result
      - name: Preserve private startup diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force private-transfer/result/delivery/diagnostics | Out-Null
          $logDir = Join-Path $env:LOCALAPPDATA 'BoxingVision/logs'
          if (Test-Path $logDir) { Copy-Item "$logDir/*" private-transfer/result/delivery/diagnostics -ErrorAction Continue }
      - name: Encrypt output before uploading any files
        if: always()
        env:
          BOXING_WINDOWS_TRANSFER_KEY: ${{ secrets.BOXING_WINDOWS_TRANSFER_KEY }}
        run: |
          python tools/private_build_transfer.py pack private-transfer/result/delivery private-transfer/delivery.zip
          python tools/private_build_transfer.py encrypt private-transfer/delivery.zip private-transfer/delivery.bvenc
      - name: Retain ciphertext only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boxing-windows-private-encrypted
          path: private-transfer/delivery.bvenc
          if-no-files-found: error
          retention-days: 7

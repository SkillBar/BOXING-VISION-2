[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxing-vision"
version = "0.1.0"
description = "Local, confidence-aware boxing broadcast analysis prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gradio>=5.44,<6",
  "numpy>=1.26,<3",
  # RTMLib currently declares both OpenCV wheels. Pin them to one compatible
  # release family and do not add a third headless distribution.
  "opencv-python>=4.10,<5",
  "opencv-contrib-python>=4.10,<5",
  "onnxruntime>=1.20,<2",
  "pillow>=10,<13",
  "rtmlib==0.0.16",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
boxing-vision = "boxing_vision.cli:main"

[tool.setuptools.packages.find]
include = ["boxing_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
